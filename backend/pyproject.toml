[project]
name = "frame-it"
version = "0.1.0"
description = "Prepare and curate pictures for a 4K art-mode TV (Samsung The Frame)."
authors = [
    { name = "Nenuphar12", email = "nenuphar12@protonmail.com" }
]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics",
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=50.0.1",
    "fastapi>=0.141.1",
    "pillow>=12.3.0",
    "platformdirs>=4.11.9",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyvips[binary]>=3.2.0",
    "samsungtvws>=3.0.6",
    "sqlalchemy>=2",
    "sse-starlette>=3.4.11",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.urls]
Homepage = "https://github.com/Nenuphar12/frame-it"
Documentation = "https://github.com/Nenuphar12/frame-it/blob/master/docs/user-guide.md"
Issues = "https://github.com/Nenuphar12/frame-it/issues"

[project.scripts]
frame-it = "frame_it.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
allowed-confusables = ["×", "−", "α", "β"]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "S", "PT", "RET", "TID"]
ignore = ["S101", "B008", "RUF012", "RUF005"]  # RUF005: pyvips image + list arithmetic

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "N802", "PT018", "E501", "RUF005", "PLR2004"]
"src/frame_it/db/migrations/**" = ["N", "E501"]

[tool.mypy]
strict = true
python_version = "3.14"
plugins = ["pydantic.mypy"]
exclude = ["src/frame_it/db/migrations/"]

[[tool.mypy.overrides]]
module = ["pyvips", "pyvips.*", "samsungtvws", "samsungtvws.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:frame_it.*"]
